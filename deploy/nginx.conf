# Add as a separate site; do not overwrite existing virtual hosts.
# TLS certificate paths and domain must be configured before enabling this site.
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://YOUR_DOMAIN$request_uri;
}
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    # Student task URLs are bearer credentials; avoid storing them in access logs.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
